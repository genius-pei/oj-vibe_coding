# ---- 低内存调优锚点（2GB 宿主机优化） ----
# 设计原则：所有服务默认绑日志大小上限，避免日志塞满磁盘
# 若宿主机 ≥ 4GB，可直接删除这些 anchors，无副作用
x-lowmem-logs: &lowmem-logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: minioj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      # ---- 2GB 宿主机的 MySQL 内存调优 ----
      # performance_schema=OFF：直接砍掉 ~200MB 内存占用（最大头）
      # innodb_buffer_pool_size=128M：默认即可，但显式声明避免 MySQL 8 自动放大
      # 其余参数收口到 OJ 场景（单后端进程连，最多 40 并发用户）
      - --performance_schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-file-size=32M
      - --max-connections=16
      - --key-buffer-size=16M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --table-open-cache=400
      - --table-definition-cache=400
      - --skip-log-bin
      - --sync-binlog=0
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 512m
    oom_score_adj: 0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - minioj_net
    <<: *lowmem-logs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minioj-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-2000}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    # backend 是无状态 + 编译子进程的协调者，但 fork 出 g++ 时峰值 200~400MB
    #   编译期 g++ 跑在容器内（execlp("g++")），受 cgroup mem_limit 约束
    #   2GB 宿主下：mysql=512 + backend=512 + frontend=32 ≈ 1056MB，余量 ~1GB 给系统
    #   注释：原 mem_limit=192m 太低，会在编译中等体积代码时触发 OOM
    mem_limit: 512m
    oom_score_adj: 100   # OOM 时优先杀 backend（不可丢题库数据）
    # tmpfs 给判题 / 编译用的临时目录，避免磁盘 I/O 也避免宿主卷累积
    tmpfs:
      - /tmp:size=64m
      - /var/tmp:size=32m
    networks:
      - minioj_net
    <<: *lowmem-logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minioj-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    mem_limit: 32m
    networks:
      - minioj_net
    <<: *lowmem-logs

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minioj-seed
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    entrypoint: ["/app/minioj-seed"]
    mem_limit: 128m
    networks:
      - minioj_net
    profiles:
      - seed
    <<: *lowmem-logs

volumes:
  mysql_data:

networks:
  minioj_net:
    driver: bridge