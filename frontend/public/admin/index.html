<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理 — MiniOJ</title>
  <meta name="description" content="MiniOJ 题库管理后台">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MiniOJ</a>
    <nav class="nav">
      <a href="/">题单</a>
      <a href="/admin/index.html" class="active">后台</a>
      <span id="auth-area">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
      </span>
    </nav>
  </header>

  <main class="admin-page container">
    <header class="page-head">
      <h1 class="page-title">题库管理</h1>
      <div class="page-actions">
        <a href="/admin/edit.html" class="button" id="btn-create">+ 新建题目</a>
        <button type="button" class="button secondary danger" id="btn-reset">一键重置题库</button>
      </div>
    </header>

    <p class="hint" id="hint"></p>

    <section class="table-wrap">
      <table class="problem-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-title">标题</th>
            <th class="col-diff">难度</th>
            <th class="col-limits">限制</th>
            <th class="col-tags">标签</th>
            <th class="col-cases">用例</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="problem-tbody">
          <tr class="placeholder"><td colspan="7">题库加载中…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/admin_list.js"></script>
</body>
</html>
