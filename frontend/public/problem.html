<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题目详情 — MiniOJ</title>
  <meta name="description" content="MiniOJ 题目详情与判题">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/problem.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MiniOJ</a>
    <nav class="nav">
      <a href="/">题单</a>
      <span id="auth-area">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
      </span>
    </nav>
  </header>

  <main class="problem-page">
    <a href="/problems.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      返回题单
    </a>

    <header class="problem-head">
      <span class="problem-id" id="problem-id">#—</span>
      <h1 class="problem-title" id="problem-title">加载中…</h1>
      <div class="problem-meta" id="problem-meta"></div>
    </header>

    <div class="problem-layout">
      <!-- 左：题目描述 -->
      <article class="description-pane">
        <div id="problem-body" class="markdown"></div>
        <section id="problem-samples"></section>
      </article>

      <!-- 右：编辑器 + 结果 -->
      <section class="editor-pane">
        <div class="editor-toolbar">
          <label class="toolbar-field">
            <span class="filter-label">语言</span>
            <select id="lang">
              <option value="cpp" selected>C++</option>
              <option value="c">C</option>
            </select>
          </label>
          <div class="toolbar-actions">
            <button id="btn-template" type="button" class="ghost-btn" title="加载模板代码">模板</button>
            <button id="btn-reset" type="button" class="ghost-btn" title="清空代码">重置</button>
          </div>
        </div>
        <div id="editor" class="editor"></div>
        <div class="submit-bar">
          <button id="btn-submit" type="button" class="primary-btn" disabled>提 交</button>
        </div>
        <section id="result" class="result" hidden></section>
      </section>
    </div>
  </main>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/ace/ace.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/problem_detail.js"></script>
</body>
</html>
