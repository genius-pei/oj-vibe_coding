<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题单 — MiniOJ</title>
  <meta name="description" content="MiniOJ 在线判题题单">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/problem.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MiniOJ</a>
    <nav class="nav">
      <a href="/problems.html" class="active">题单</a>
      <span id="auth-area">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
      </span>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <h1 class="page-title">题单</h1>
      <span class="count" id="problem-count"></span>
    </div>

    <section class="filters">
      <label class="filter-field">
        <span class="filter-label">难度</span>
        <select id="filter-difficulty">
          <option value="">全部</option>
          <option value="easy">简单</option>
          <option value="medium">中等</option>
          <option value="hard">困难</option>
        </select>
      </label>
      <label class="filter-field">
        <span class="filter-label">标签</span>
        <select id="filter-tag">
          <option value="">全部</option>
        </select>
      </label>
    </section>

    <section id="problem-list" class="problem-grid">
      <p class="empty">题单加载中…</p>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/problem_list.js"></script>
</body>
</html>
