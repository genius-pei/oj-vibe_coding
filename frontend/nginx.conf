server {
    listen 80;
    server_name _;

    # 静态资源（落地页 / 题单 / 题目详情 / 登录注册 / 后台）
    root /usr/share/nginx/html;
    index index.html;

    # gzip：小机器上也可开（CPU 换流量，nginx:alpine 自带）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;

    # 健康检查端点（可选）
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 反代后端 API；上传体限制按 SPEC § 6.1 适度放宽，代码提交可能较长
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 4m;
    }

    # 静态兜底：找不到文件时回落到 index.html（前端 SPA 风格路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 缓存 vendor/（CodeMirror / marked 等本地化第三方）
    location ~* ^/vendor/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}